        <main class="prova3">
            <section class="calculadora">
                <h3> 🧮 Simulador de Pontos </h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label> Arroz (5kg) - 10 pts </label>
                        <input type="number" id="qtdeArroz" min="0">
                    </div>
                    <div class="form-group">
                        <label> Feijão (2kg) - 8 pts </label>
                        <input type="number" id="qtdeFeijao" min="0">
                    </div>
                </div>
            <!-- quando este botao for clicado a funcao calcular() sra chamada no JavaScript -->
                <button class="button" onclick="calcular()"> Calcular Total da Equipe </button>
                <div id="resultado" class="resultado-box"> 
                    Pontuação total: 0 pontos
                </div>
            </section>
           
        </main>
    <footer>
        <section class="rodape">
            <p>Coordenação Trote Solidário 2026: trotesolidario@facef.br</p>
            <p>Uni-FACEF - Centro Universitário Municipal de Franca</p>
        </section>
    </footer> <!-- elementos semanticos servem para ajudar os motores de busca-->
    <script> <!-- programar JavaScript -->
        function calcular(){
            // JS é uma linguagem não tipada (sem tipo de dados)
            // Number() é uma função que converte texto em numero 
            // recupera o valor informado no elemento cokm id qtdeArroz
            let qtdeArroz = Number(document.getElementById("qtdeArroz").value)
            let qtdeFeijao = Number(document.getElementById("qtdeFeijao").value)
            // calcula o valor total de pontos
            let pontos = (qtdeArroz * 10) + (qtdeFeijao * 8)
            // vamos exibir o resultado para o usuário
            document.getElementById("resultado").innerText = "Pontuaçao total: " + pontos
        }
    </script>
    </body>
